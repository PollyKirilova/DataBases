<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SQL Урок: Пълен курс по Агрегиране и Групиране</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; }
        .terminal-bg { background: #1a1a1a; }
        .sql-gradient { background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%); }
    </style>
</head>
<body class="bg-slate-50">
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        // Икони
        const IconCalc = () => (<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="16" height="20" x="4" y="2" rx="2"/><line x1="8" x2="16" y1="6" y2="6"/><path d="M16 10h.01"/><path d="M12 10h.01"/><path d="M8 10h.01"/><path d="M12 14h.01"/><path d="M8 14h.01"/><path d="M12 18h.01"/><path d="M8 18h.01"/></svg>);
        const IconVs = () => (<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><path d="M12 2v20"/><path d="m17 7-5-5-5 5"/><path d="m17 17-5 5-5-5"/></svg>);
        const IconLayers = () => (<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><polygon points="12 2 2 7 12 12 22 7 12 2"/><polyline points="2 17 12 22 22 17"/><polyline points="2 12 12 17 22 12"/></svg>);
        const IconAlert = () => (<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>);

        const App = () => {
            const [activeTab, setActiveTab] = useState('theory');
            const [selectedScenario, setSelectedScenario] = useState(null);

            const inventory = [
                { id: 1, name: 'Лаптоп Pro', category: 'Електроника', price: 2500, stock: 15 },
                { id: 2, name: 'Мишка Wireless', category: 'Аксесоари', price: 45, stock: 120 },
                { id: 3, name: 'Монитор 27"', category: 'Електроника', price: 600, stock: 8 },
                { id: 4, name: 'Стикер', category: 'Маркетинг', price: 5, stock: 500 },
                { id: 5, name: 'Слушалки', category: 'Аксесоари', price: 180, stock: 40 }
            ];

            const basicFunctions = [
                { name: 'COUNT', desc: 'Брои редовете', syntax: 'SELECT COUNT(*) FROM products;' },
                { name: 'SUM', desc: 'Сумира стойности', syntax: 'SELECT SUM(stock) FROM products;' },
                { name: 'AVG', desc: 'Средна стойност', syntax: 'SELECT AVG(price) FROM products;' },
                { name: 'MIN/MAX', desc: 'Минимум и максимум', syntax: 'SELECT MIN(price), MAX(price) FROM products;' }
            ];

            const scenarios = {
                'GROUP_BY_BASIC': {
                    title: 'Основи на GROUP BY',
                    concept: 'Разделя редовете на групи по категория.',
                    sql: "SELECT category, COUNT(*) \nFROM products \nGROUP BY category;",
                    result: [
                        { col1: 'Електроника', col2: '2' },
                        { col1: 'Аксесоари', col2: '2' },
                        { col1: 'Маркетинг', col2: '1' }
                    ],
                    note: 'SQL разделя таблицата на малки под-таблици за всяка категория и брои редовете в тях.'
                },
                'WHERE_VS_HAVING': {
                    title: 'WHERE и HAVING заедно',
                    concept: 'Използваме WHERE за индивидуални редове и HAVING за групите.',
                    sql: "SELECT category, SUM(stock)\nFROM products\nWHERE price > 100\nGROUP BY category\nHAVING SUM(stock) > 20;",
                    result: [
                        { col1: 'Аксесоари', col2: '40' }
                    ],
                    note: 'WHERE премахва евтините предмети преди групирането. HAVING филтрира вече сметнатите суми.'
                }
            };

            return (
                <div className="max-w-6xl mx-auto p-4 md:p-10">
                    <header className="mb-12 flex flex-col md:flex-row md:items-center justify-between gap-6">
                        <div className="flex items-center gap-4">
                            <div className="bg-indigo-600 p-4 rounded-3xl text-white shadow-xl shadow-indigo-100">
                                <IconCalc />
                            </div>
                            <div>
                                <h1 className="text-3xl font-black text-slate-900 leading-none tracking-tight uppercase">SQL Aggregation Master</h1>
                                <p className="text-slate-500 font-medium mt-2 uppercase text-[10px] tracking-[0.3em] italic">Functions • Group By • Having</p>
                            </div>
                        </div>
                        
                        <div className="flex gap-2 p-1.5 bg-slate-200 rounded-2xl w-fit">
                            <button onClick={() => setActiveTab('theory')} className={`px-8 py-2.5 rounded-xl font-bold transition-all text-sm ${activeTab === 'theory' ? 'bg-white text-indigo-600 shadow-sm' : 'text-slate-600'}`}>Урок</button>
                            <button onClick={() => setActiveTab('lab')} className={`px-8 py-2.5 rounded-xl font-bold transition-all text-sm ${activeTab === 'lab' ? 'bg-white text-indigo-600 shadow-sm' : 'text-slate-600'}`}>Практика</button>
                        </div>
                    </header>

                    {activeTab === 'theory' ? (
                        <div className="space-y-12 animate-in fade-in duration-500">
                            {/* Функции */}
                            <div className="bg-white p-8 rounded-[2.5rem] border border-slate-200 shadow-sm">
                                <h2 className="text-2xl font-bold mb-6 text-slate-800 flex items-center gap-3">
                                    <IconCalc className="text-indigo-600" />
                                    1. Агрегиращи функции
                                </h2>
                                <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
                                    {basicFunctions.map(f => (
                                        <div key={f.name} className="p-5 bg-slate-50 rounded-2xl border border-slate-100">
                                            <div className="font-black text-indigo-600 mb-1">{f.name}()</div>
                                            <p className="text-xs text-slate-500 mb-3">{f.desc}</p>
                                            <code className="text-[10px] bg-slate-800 text-indigo-200 p-2 rounded-lg block">
                                                {f.syntax}
                                            </code>
                                        </div>
                                    ))}
                                </div>
                            </div>

                            {/* Сравнение WHERE vs HAVING */}
                            <div className="bg-white rounded-[2.5rem] border border-slate-200 shadow-sm overflow-hidden">
                                <div className="p-8 border-b border-slate-100 bg-slate-50/50 flex items-center gap-3">
                                    <IconVs className="text-rose-500" />
                                    <h2 className="text-xl font-black text-slate-800 uppercase tracking-widest">WHERE срещу HAVING</h2>
                                </div>
                                <div className="overflow-x-auto">
                                    <table className="w-full text-left border-collapse">
                                        <thead>
                                            <tr className="bg-white">
                                                <th className="p-6 text-[10px] font-black text-slate-400 uppercase border-b border-slate-100">Характеристика</th>
                                                <th className="p-6 text-sm font-black text-indigo-600 uppercase border-b border-slate-100 bg-indigo-50/30 text-center">WHERE</th>
                                                <th className="p-6 text-sm font-black text-emerald-600 uppercase border-b border-slate-100 bg-emerald-50/30 text-center">HAVING</th>
                                            </tr>
                                        </thead>
                                        <tbody className="text-sm divide-y divide-slate-50">
                                            <tr>
                                                <td className="p-6 font-bold text-slate-700 bg-slate-50/30 italic">Изпълнение</td>
                                                <td className="p-6 text-center text-slate-600">Преди GROUP BY</td>
                                                <td className="p-6 text-center text-slate-600 font-medium">След GROUP BY</td>
                                            </tr>
                                            <tr>
                                                <td className="p-6 font-bold text-slate-700 bg-slate-50/30 italic">Приложение</td>
                                                <td className="p-6 text-center text-slate-600 underline decoration-indigo-200">Индивидуални редове</td>
                                                <td className="p-6 text-center text-slate-600 underline decoration-emerald-200 font-medium">Цели групи</td>
                                            </tr>
                                            <tr>
                                                <td className="p-6 font-bold text-slate-700 bg-slate-50/30 italic">Функции</td>
                                                <td className="p-6 text-center">
                                                    <span className="text-rose-500 font-black">X</span> (Недопустимо)
                                                </td>
                                                <td className="p-6 text-center">
                                                    <span className="text-emerald-500 font-black">✓</span> (Допустимо)
                                                </td>
                                            </tr>
                                        </tbody>
                                    </table>
                                </div>
                            </div>

                            {/* Ред на изпълнение */}
                            <div className="bg-slate-900 rounded-[3rem] p-10 text-white shadow-2xl relative overflow-hidden">
                                <h3 className="text-indigo-400 text-[10px] font-black uppercase tracking-[0.3em] mb-10 text-center italic">Log of Execution (SQL Pipeline)</h3>
                                <div className="flex flex-col md:flex-row items-center justify-center gap-4">
                                    <div className="p-4 bg-slate-800 rounded-2xl border border-slate-700 text-center w-full md:w-32 opacity-50 text-xs">FROM</div>
                                    <div className="hidden md:block text-slate-700">→</div>
                                    <div className="p-5 bg-indigo-600 rounded-2xl border-2 border-indigo-400 text-center w-full md:w-40 font-black shadow-lg shadow-indigo-500/20">WHERE</div>
                                    <div className="hidden md:block text-indigo-400 animate-pulse">→</div>
                                    <div className="p-4 bg-slate-800 rounded-2xl border border-slate-700 text-center w-full md:w-32 opacity-50 text-xs">GROUP BY</div>
                                    <div className="hidden md:block text-emerald-400 animate-pulse">→</div>
                                    <div className="p-5 bg-emerald-600 rounded-2xl border-2 border-emerald-400 text-center w-full md:w-40 font-black shadow-lg shadow-emerald-500/20">HAVING</div>
                                    <div className="hidden md:block text-slate-700">→</div>
                                    <div className="p-4 bg-slate-800 rounded-2xl border border-slate-700 text-center w-full md:w-32 opacity-50 text-xs">SELECT</div>
                                </div>
                            </div>
                        </div>
                    ) : (
                        <div className="space-y-8 animate-in slide-in-from-bottom-4 duration-500">
                            {/* Таблица */}
                            <div className="bg-white p-6 rounded-3xl border border-slate-200 shadow-sm overflow-hidden">
                                <h3 className="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-4 px-2 italic">Инвентар: products</h3>
                                <div className="overflow-x-auto">
                                    <table className="w-full text-sm">
                                        <thead className="bg-slate-50 text-slate-400 text-[10px] uppercase font-black">
                                            <tr>
                                                <th className="py-3 px-4 text-left">Продукт</th>
                                                <th className="py-3 px-4 text-left">Категория</th>
                                                <th className="py-3 px-4 text-right">Цена</th>
                                                <th className="py-3 px-4 text-right">Stock</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-slate-100">
                                            {inventory.map(p => (
                                                <tr key={p.id} className="hover:bg-slate-50 transition-colors">
                                                    <td className="py-3 px-4 font-bold text-slate-700">{p.name}</td>
                                                    <td className="py-3 px-4 text-slate-500">{p.category}</td>
                                                    <td className="py-3 px-4 text-right font-mono text-indigo-600">{p.price.toFixed(2)}</td>
                                                    <td className="py-3 px-4 text-right font-mono font-bold">{p.stock}</td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>

                            {/* Избор на сценарий */}
                            <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                {Object.keys(scenarios).map(key => (
                                    <button 
                                        key={key} 
                                        onClick={() => setSelectedScenario(key)}
                                        className={`p-6 rounded-[2rem] border-2 text-left transition-all ${selectedScenario === key ? 'border-indigo-600 bg-indigo-50 shadow-lg scale-[1.02]' : 'border-white bg-white hover:border-indigo-100 shadow-sm'}`}
                                    >
                                        <h4 className="font-black text-slate-800 mb-1 uppercase tracking-tighter">{scenarios[key].title}</h4>
                                        <p className="text-[10px] text-slate-400 font-bold uppercase tracking-widest">Интерактивен пример</p>
                                    </button>
                                ))}
                            </div>

                            {selectedScenario && (
                                <div className="grid grid-cols-1 lg:grid-cols-2 gap-8 animate-in zoom-in-95 duration-300">
                                    <div className="terminal-bg rounded-[2.5rem] p-10 shadow-2xl font-mono border-t-[14px] border-slate-800">
                                        <div className="text-indigo-500 text-[10px] mb-8 font-black uppercase tracking-[0.4em]">SQL Query</div>
                                        <pre className="text-indigo-100 text-sm whitespace-pre-wrap leading-relaxed">
                                            {scenarios[selectedScenario].sql}
                                        </pre>
                                    </div>

                                    <div className="bg-white rounded-[2.5rem] p-10 border border-slate-200 flex flex-col justify-between">
                                        <div>
                                            <h4 className="text-[10px] font-black text-slate-400 uppercase tracking-widest mb-8 italic underline">Output:</h4>
                                            <div className="bg-slate-50 rounded-2xl p-8 border border-slate-100 min-h-[140px] flex items-center justify-center">
                                                <table className="w-full text-sm">
                                                    <thead>
                                                        <tr className="text-slate-400 text-[10px] font-black uppercase border-b border-slate-200">
                                                            <th className="pb-3 text-left">Category</th>
                                                            <th className="pb-3 text-right">Result</th>
                                                        </tr>
                                                    </thead>
                                                    <tbody>
                                                        {scenarios[selectedScenario].result.map((r, i) => (
                                                            <tr key={i}><td className="py-3 font-bold">{r.col1}</td><td className="py-3 text-right text-indigo-600 font-black text-xl">{r.col2}</td></tr>
                                                        ))}
                                                    </tbody>
                                                </table>
                                            </div>
                                        </div>
                                        <div className="mt-8 p-6 bg-amber-50 rounded-2xl border border-amber-100 flex gap-4 text-xs">
                                            <div className="shrink-0 w-8 h-8 bg-amber-500 text-white rounded-lg flex items-center justify-center font-black">?</div>
                                            <p className="text-amber-900 leading-relaxed italic">{scenarios[selectedScenario].note}</p>
                                        </div>
                                    </div>
                                </div>
                            )}
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>

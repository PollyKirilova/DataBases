<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SQL Урок: Агрегиращи функции</title>
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; }
    </style>
</head>
<body class="bg-slate-50">
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        // Помощни икони (SVG компоненти), за да не зависим от външни библиотеки за икони
        const IconCalc = () => (<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><rect width="16" height="20" x="4" y="2" rx="2"/><line x1="8" x2="16" y1="6" y2="6"/><line x1="16" x2="16" y1="14" y2="18"/><path d="M16 10h.01"/><path d="M12 10h.01"/><path d="M8 10h.01"/><path d="M12 14h.01"/><path d="M8 14h.01"/><path d="M12 18h.01"/><path d="M8 18h.01"/></svg>);
        const IconDatabase = () => (<svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5V19A9 3 0 0 0 21 19V5"/><path d="M3 12A9 3 0 0 0 21 12"/></svg>);

        const App = () => {
            const [activeTab, setActiveTab] = useState('theory');
            const [selectedFunc, setSelectedFunc] = useState(null);
            const [queryResult, setQueryResult] = useState(null);

            const inventory = [
                { id: 1, name: 'Лаптоп Pro', category: 'Електроника', price: 2500, stock: 15 },
                { id: 2, name: 'Мишка Wireless', category: 'Аксесоари', price: 45, stock: 120 },
                { id: 3, name: 'Монитор 27"', category: 'Електроника', price: 600, stock: 8 },
                { id: 4, name: 'Клавиатура RGB', category: 'Аксесоари', price: 120, stock: 45 },
                { id: 5, name: 'Слушалки', category: 'Аудио', price: 180, stock: 30 }
            ];

            const functions = [
                { name: 'COUNT', desc: 'Брои редовете', syntax: 'SELECT COUNT(*) FROM products;', details: 'Брои всички записи в таблицата.' },
                { name: 'SUM', desc: 'Сумира числа', syntax: 'SELECT SUM(stock) FROM products;', details: 'Събира всички стойности в колона stock.' },
                { name: 'AVG', desc: 'Средна стойност', syntax: 'SELECT AVG(price) FROM products;', details: 'Пресмята средната цена на продуктите.' },
                { name: 'MIN', desc: 'Минимална стойност', syntax: 'SELECT MIN(price) FROM products;', details: 'Намира най-евтиния продукт.' },
                { name: 'MAX', desc: 'Максимална стойност', syntax: 'SELECT MAX(price) FROM products;', details: 'Намира най-скъпия продукт.' }
            ];

            const runExample = (fName) => {
                setSelectedFunc(fName);
                let result;
                const prices = inventory.map(p => p.price);
                const stocks = inventory.map(p => p.stock);

                if (fName === 'COUNT') result = inventory.length;
                else if (fName === 'SUM') result = stocks.reduce((a, b) => a + b, 0);
                else if (fName === 'AVG') result = (prices.reduce((a, b) => a + b, 0) / prices.length).toFixed(2);
                else if (fName === 'MIN') result = Math.min(...prices);
                else if (fName === 'MAX') result = Math.max(...prices);
                
                setQueryResult(result);
            };

            return (
                <div className="max-w-6xl mx-auto p-4 md:p-8">
                    <header className="mb-10">
                        <div className="flex items-center gap-4 mb-6">
                            <div className="bg-indigo-600 p-3 rounded-2xl text-white shadow-lg">
                                <IconCalc />
                            </div>
                            <div>
                                <h1 className="text-3xl font-black text-slate-900 uppercase">SQL Агрегиране</h1>
                                <p className="text-slate-500 font-medium italic">Урок за ИТ Гимназия</p>
                            </div>
                        </div>
                        
                        <div className="flex gap-2 p-1 bg-slate-200 w-fit rounded-xl">
                            <button onClick={() => setActiveTab('theory')} className={`px-6 py-2 rounded-lg font-bold transition-all ${activeTab === 'theory' ? 'bg-white text-indigo-600 shadow-sm' : 'text-slate-600'}`}>Урок</button>
                            <button onClick={() => setActiveTab('lab')} className={`px-6 py-2 rounded-lg font-bold transition-all ${activeTab === 'lab' ? 'bg-white text-indigo-600 shadow-sm' : 'text-slate-600'}`}>Лаборатория</button>
                        </div>
                    </header>

                    {activeTab === 'theory' ? (
                        <div className="grid grid-cols-1 md:grid-cols-2 gap-8 animate-fadeIn">
                            <div className="space-y-4">
                                <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                                    <h2 className="text-xl font-bold mb-3">Основни функции</h2>
                                    <p className="text-slate-600 text-sm mb-4">Агрегиращите функции обработват група от данни и връщат една стойност.</p>
                                    <div className="space-y-2">
                                        {functions.map(f => (
                                            <div key={f.name} className="p-3 bg-slate-50 rounded-lg border border-slate-100">
                                                <span className="font-bold text-indigo-600">{f.name}()</span>
                                                <p className="text-xs text-slate-500">{f.desc} - <code className="bg-slate-200 px-1 rounded">{f.syntax}</code></p>
                                            </div>
                                        ))}
                                    </div>
                                </div>
                            </div>
                            <div className="bg-slate-900 rounded-3xl p-8 text-indigo-300 font-mono shadow-xl">
                                <p className="text-slate-500 mb-4 uppercase text-xs tracking-widest border-b border-slate-800 pb-2">Примерна заявка</p>
                                <p><span className="text-pink-400">SELECT</span> <span className="text-indigo-400">AVG</span>(price)</p>
                                <p><span className="text-pink-400">FROM</span> products</p>
                                <p><span className="text-pink-400">WHERE</span> category = <span className="text-emerald-400">'Електроника'</span>;</p>
                                <div className="mt-10 p-4 bg-slate-800 rounded-xl text-slate-400 text-sm italic">
                                    -- Връща средната цена само за електроника
                                </div>
                            </div>
                        </div>
                    ) : (
                        <div className="space-y-8 animate-slideUp">
                            <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm">
                                <h3 className="text-lg font-bold mb-4 flex items-center gap-2">
                                    <IconDatabase /> Таблица: products
                                </h3>
                                <div className="overflow-x-auto">
                                    <table className="w-full text-sm">
                                        <thead className="bg-slate-50 text-slate-500 font-bold uppercase text-xs">
                                            <tr>
                                                <th className="p-3 text-left">Име</th>
                                                <th className="p-3 text-left">Категория</th>
                                                <th className="p-3 text-right">Цена</th>
                                                <th className="p-3 text-right">Наличност</th>
                                            </tr>
                                        </thead>
                                        <tbody className="divide-y divide-slate-100">
                                            {inventory.map(p => (
                                                <tr key={p.id} className="hover:bg-slate-50">
                                                    <td className="p-3 font-bold">{p.name}</td>
                                                    <td className="p-3 text-slate-500">{p.category}</td>
                                                    <td className="p-3 text-right text-indigo-600 font-bold">{p.price} лв</td>
                                                    <td className="p-3 text-right">{p.stock}</td>
                                                </tr>
                                            ))}
                                        </tbody>
                                    </table>
                                </div>
                            </div>

                            <div className="grid grid-cols-2 md:grid-cols-5 gap-3">
                                {functions.map(f => (
                                    <button key={f.name} onClick={() => runExample(f.name)} className={`p-4 rounded-xl border-2 font-black transition-all ${selectedFunc === f.name ? 'border-indigo-600 bg-indigo-50 text-indigo-600' : 'border-white bg-white hover:border-indigo-100'}`}>
                                        {f.name}()
                                    </button>
                                ))}
                            </div>

                            {selectedFunc && (
                                <div className="bg-slate-900 rounded-3xl p-8 text-white shadow-2xl border-4 border-slate-800 animate-fadeIn">
                                    <p className="text-indigo-400 font-mono text-sm mb-4 uppercase tracking-widest">Изпълнение на SQL...</p>
                                    <div className="text-5xl font-black mb-2">{queryResult} 
                                        <span className="text-xl font-normal text-slate-500 ml-3">
                                            {selectedFunc === 'COUNT' ? 'реда' : selectedFunc === 'SUM' ? 'бройки' : 'лв.'}
                                        </span>
                                    </div>
                                    <p className="text-slate-400 italic text-sm">{functions.find(f => f.name === selectedFunc).details}</p>
                                </div>
                            )}
                        </div>
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>

    <style>
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
        .animate-fadeIn { animation: fadeIn 0.5s ease-out; }
        .animate-slideUp { animation: slideUp 0.5s ease-out; }
    </style>
</body>
</html>
